services:
  saltline:
    build: .
    image: saltline:latest
    container_name: saltline
    restart: unless-stopped
    ports:
      # "cổng VPS:cổng container". Đổi 80 thành cổng khác nếu cổng 80 đã bị chiếm
      # (ví dụ đang chạy Nginx/Caddy ở host làm reverse proxy thì dùng "127.0.0.1:8080:8080")
      - "80:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

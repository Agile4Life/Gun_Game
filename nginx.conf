server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nén gzip: file HTML ~1,4 MB nên nén giúp tải nhanh hơn đáng kể
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    # text/html luôn được nén sẵn khi gzip on

    # Header bảo mật cơ bản (không đặt CSP vì game dùng script/style inline và Google Fonts)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    server_tokens off;

    # Endpoint cho HEALTHCHECK / load balancer
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Trang game: luôn kiểm tra lại với server (ETag) để cập nhật bản mới ngay khi deploy
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
}
